name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch: {} # allows an on-demand manual run to test the pipeline without cutting a new release

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          # Writes ~/.m2/settings.xml with a <server id="central"> entry
          # sourced from these secrets — required by the
          # central-publishing-maven-plugin's publishingServerId.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify tests pass before releasing
        run: mvn -B test

      - name: Deploy to Maven Central
        # -Dgpg.passphrase is maven-gpg-plugin's own recognized property —
        # the setup-java gpg-passphrase input only wires up settings.xml's
        # security dispatcher (settings-security.xml), which the plugin
        # never actually consults, so that alone silently doesn't work.
        run: mvn -B -Prelease -Dgpg.passphrase="$GPG_PASSPHRASE" deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
